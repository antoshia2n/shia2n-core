<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>シアニンパネル</title>
<style>
:root{--bg:#f5f0eb;--panel:#fff;--soft:#f7f3ee;--line:#e6dfd6;--field:#a39a90;--fg:#1a1a1a;--muted:#6b6259;--accent:#f59e0b;--accent-ink:#b45309;--accent-bg:#fef3c7;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1b1916;--panel:#24211d;--soft:#2b2823;--line:#38332c;--field:#6f665c;--fg:#f1ece6;--muted:#b0a69b;--accent:#fbbf24;--accent-ink:#fbbf24;--accent-bg:rgba(251,191,36,.16);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 "Geist","Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
body{display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:8px}
.bar{position:relative;display:flex;align-items:center;gap:4px;padding:3px 6px 6px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.stripwrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.strip{display:flex;gap:2px;overflow-x:auto;overflow-y:hidden;min-width:0;cursor:grab;overscroll-behavior-x:contain;scrollbar-width:none;position:relative;z-index:1;padding-block:3px;scroll-padding-inline:22px}
.strip::-webkit-scrollbar{display:none}
.strip.dragging{cursor:grabbing;user-select:none}
.strip.dragging .ab{pointer-events:none}
/* 帯の下のスライダー（いつも見える・つまみを引く／溝を押すと横に動く）。Mac の重ね表示のスクロールバーは隠れるので自前で描く */
.slider{position:relative;height:4px;margin:1px 4px 2px;border-radius:2px;background:var(--line);cursor:pointer;touch-action:none}
.slider::before{content:"";position:absolute;left:0;right:0;top:-5px;bottom:-19px} /* 押せる範囲 28px（上は帯の下の余白まで・下は名前の行へ。名前の行のボタンはその上に出す） */
.slider .th{position:absolute;top:0;bottom:0;left:0;border-radius:2px;background:var(--muted);cursor:grab}
.slider .th:hover,.slider.dragging .th{background:var(--fg)}
.slider.dragging .th{cursor:grabbing}
.strip.r{mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent)}
.strip.l{mask-image:linear-gradient(90deg,transparent,#000 22px)}
.strip.l.r{mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent)}
.ab{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:10px;position:relative}
.ab:hover{background:var(--soft)}
.ab[aria-pressed="true"]{background:var(--accent-bg)}
.ab[aria-pressed="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:3px;border-radius:2px;background:var(--accent-ink)}
.ib{height:44px;min-width:44px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:4px;border-radius:10px;color:var(--muted);font-weight:700;font-size:12px;flex:none}
.ib:hover,.ib[aria-expanded="true"]{background:var(--soft);color:var(--fg)}
.sep{width:1px;height:24px;background:var(--line);flex:none}
@media (pointer:fine){.ab{width:34px;height:34px}.ib{height:34px;min-width:34px}}
.name{font-size:12px;color:var(--muted);padding:3px 12px 4px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:6px;align-items:center;flex:none;white-space:nowrap;overflow:hidden}
.name b{color:var(--fg);font-size:12.5px}
.stage{flex:1;min-height:0;position:relative}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.pop{position:fixed;z-index:10;top:52px;right:6px;width:min(300px,calc(100vw - 12px));max-height:calc(100vh - 64px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(60,40,20,.14);padding:6px}
.pop h2{font-size:12px;font-weight:700;color:var(--muted);margin:6px 10px 4px}
.it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:0 10px;min-height:44px;border-radius:8px;font-size:13.5px;color:var(--fg);text-decoration:none}
@media (pointer:fine){.it{min-height:34px}}
.it:hover,.it:focus-visible{background:var(--soft)}
.it .l{flex:1}
.it .r{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:2px}
.row .it{flex:1;min-width:0}
.it[aria-current="true"]{background:var(--accent-bg);box-shadow:inset 3px 0 0 var(--accent-ink)}
.go{flex:none;width:44px;min-height:44px;border-radius:8px;color:var(--muted);font-size:13px;font-weight:700}
@media (pointer:fine){.go{width:34px;min-height:34px}}
.go:hover,.go:focus-visible{background:var(--soft);color:var(--fg)}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;padding:24px;text-align:center}
.name .nb{padding:0 8px;min-width:0;font-size:12px;position:relative;z-index:2}
@media (pointer:fine){.name .nb{height:28px}}
.loading{position:absolute;inset:0;z-index:1;display:grid;place-items:center;background:var(--bg);color:var(--muted);font-size:13px}
.loading span::before{content:"";display:inline-block;width:12px;height:12px;margin-right:8px;vertical-align:-1px;border:2px solid var(--line);border-top-color:var(--accent-ink);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.loading span::before{animation:none}}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;font-weight:700;line-height:1;padding:6px 8px;border-radius:6px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.name .ai{display:inline-flex;flex:none}
.name .ai:empty{display:none}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<!-- 上の帯：全アプリを左から使った順（押すとこのパネルの中で切り替わる・横に動かせる）。「一覧 ▼」は名前で選ぶ・↗ で新しいタブ。いまのアプリの「読み込み直す」「別タブで開く」は下の名前の行 -->
<div class="bar">
  <div class="stripwrap"><div class="strip l r" id="strip" role="toolbar" aria-label="アプリ（左から使った順）"></div><div class="slider" id="slider" aria-hidden="true"><div class="th" id="thumb"></div></div></div>
  <span class="sep" aria-hidden="true"></span>
  <button class="ib" id="more" type="button" aria-haspopup="true" aria-expanded="false" aria-label="アプリの一覧" title="アプリの一覧（名前で選ぶ・↗ で新しいタブ）">一覧 ▼</button>
</div>
<div class="name" id="name"><span class="ai" id="appicon" aria-hidden="true"></span><b id="appname" aria-live="polite"></b><span style="flex:1"></span><span id="namebtns" style="display:flex;gap:2px"></span></div>
<div class="stage" id="stage"><div class="empty" id="empty">上の帯からアプリを選んでください</div><div class="loading" id="loading" hidden aria-hidden="true"><span id="loadmsg">読み込み中…</span></div></div>
<span class="sr" id="sr" role="status"></span>
<div class="tip" id="tip" hidden aria-hidden="true"></div>
<div class="pop" id="pop" hidden role="menu" aria-label="アプリの一覧"></div>
<script src="apps.js"></script>
<script src="panel.js"></script>
<script src="bridge-swipe.js"></script>
<script src="bridge-x.js"></script>
<script src="bridge-anken.js"></script>
<script src="bridge-dokusho.js"></script>
<script src="bridge-marke.js"></script>
</body>
</html>
